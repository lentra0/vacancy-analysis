<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Сбор вакансий HH</title>
  <desc id="desc">Сборщик читает выдачу и карточки через Chromium или API. Карточки и результаты запусков сохраняются в SQLite. Команда export читает из базы список карточек.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#607386"/>
    </marker>
    <style>
      text { font: 16px system-ui, sans-serif; fill: #192d3e; }
      .heading { font-size: 25px; font-weight: 650; }
      .detail { font-size: 13px; fill: #435869; }
      .box { fill: #d9efe9; stroke: #3f8378; stroke-width: 1.5; }
      .line { fill: none; stroke: #607386; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="300" rx="16" fill="#f8fafc"/>
  <text x="36" y="44" class="heading">Сбор вакансий HH</text>

  <path class="line" d="M204 162H228V114H249"/>
  <path class="line" d="M204 162H228V210H249"/>
  <path class="line" d="M442 114H466V162H487"/>
  <path class="line" d="M442 210H466V162H487"/>
  <path class="line" d="M683 162H716"/>

  <rect class="box" x="36" y="132" width="168" height="60" rx="10"/>
  <rect class="box" x="250" y="84" width="192" height="60" rx="10"/>
  <rect class="box" x="250" y="180" width="192" height="60" rx="10"/>
  <rect class="box" x="488" y="132" width="195" height="60" rx="10"/>
  <rect class="box" x="717" y="132" width="147" height="60" rx="10"/>

  <g text-anchor="middle">
    <text x="120" y="156">Запуск сбора</text>
    <text class="detail" x="120" y="176">Запрос и регион</text>
    <text x="346" y="108">Chromium</text>
    <text class="detail" x="346" y="128">HTML выдачи и карточек</text>
    <text x="346" y="204">API HH</text>
    <text class="detail" x="346" y="224">JSON по окну дат</text>
    <text x="585" y="156">SQLite</text>
    <text class="detail" x="585" y="176">Карточки и итоги запусков</text>
    <text x="790" y="156">Выгрузка</text>
    <text class="detail" x="790" y="176">Массив JSON</text>
  </g>
</svg>
