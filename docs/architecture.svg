<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура и роадмап</title>
  <desc id="desc">Оркестратор запускает независимые парсеры. Парсеры и ручной импорт пишут исходные вакансии в общую базу. Нормализация использует справочники, после проверки вакансии поступают в аналитику.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="m2 1 5 3.5L2 8" fill="none" stroke="#4b4b4b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", sans-serif; }
      .heading { fill: #161616; font-size: 30px; font-weight: 700; }
      .title { fill: #171717; font-size: 18px; font-weight: 650; }
      .detail { fill: #4a4a4a; font-size: 13px; }
      .ready { fill: #ededed; stroke: #343434; stroke-width: 1.3; }
      .future { fill: #fff; stroke: #696969; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .link { fill: none; stroke: #555; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="668" rx="20" fill="#fafafa" stroke="#d7d7d7"/>
  <text x="40" y="61" class="heading">Архитектура и роадмап</text>
  <rect x="666" y="43" width="17" height="17" rx="3" class="ready"/>
  <text x="692" y="56" class="detail">В коде</text>
  <rect x="790" y="43" width="17" height="17" rx="3" class="future"/>
  <text x="816" y="56" class="detail">В плане</text>
  <path d="M40 81h880" stroke="#d7d7d7"/>

  <path class="link" d="M317 158h22"/>
  <path class="link" d="M480 215v26"/>
  <path class="link" d="M784 215v12q0 4-4 4H580q-4 0-4 4v6"/>
  <path class="link" d="M480 355v26"/>
  <path class="link" d="M317 438h22" marker-start="url(#arrow)"/>
  <path class="link" d="M621 438h22"/>
  <path class="link" d="M784 495v26"/>
  <path class="link" d="M643 578h-22"/>
  <path class="link" d="M339 578h-22"/>

  <g>
    <rect x="40" y="106" width="272" height="104" rx="12" class="ready"/>
    <text x="58" y="141" class="title">Оркестратор</text>
    <text x="58" y="166" class="detail">Запуски и расписание</text>
    <text x="58" y="185" class="detail">Статусы запусков</text>
  </g>
  <g>
    <rect x="344" y="106" width="272" height="104" rx="12" class="ready"/>
    <text x="362" y="141" class="title">Модуль сбора</text>
    <text x="362" y="166" class="detail">Независимые адаптеры</text>
    <text x="362" y="185" class="detail">для разных источников</text>
  </g>
  <g>
    <rect x="648" y="106" width="272" height="104" rx="12" class="future"/>
    <text x="666" y="141" class="title">Ручной импорт</text>
    <text x="666" y="166" class="detail">Карточки для проверки</text>
    <text x="666" y="185" class="detail">нормализации и аналитики</text>
  </g>

  <g>
    <rect x="344" y="246" width="272" height="104" rx="12" class="ready"/>
    <text x="362" y="281" class="title">Исходные вакансии</text>
    <text x="362" y="306" class="detail">Описания и метаданные</text>
    <text x="362" y="325" class="detail">в общей базе SQLite</text>
  </g>

  <g>
    <rect x="40" y="386" width="272" height="104" rx="12" class="future"/>
    <text x="58" y="421" class="title">Справочники</text>
    <text x="58" y="446" class="detail">Единые названия</text>
    <text x="58" y="465" class="detail">профессий и навыков</text>
  </g>
  <g>
    <rect x="344" y="386" width="272" height="104" rx="12" class="future"/>
    <text x="362" y="421" class="title">Нормализация</text>
    <text x="362" y="446" class="detail">Профессия и навыки</text>
    <text x="362" y="465" class="detail">из описания вакансии</text>
  </g>
  <g>
    <rect x="648" y="386" width="272" height="104" rx="12" class="future"/>
    <text x="666" y="421" class="title">Проверка правил</text>
    <text x="666" y="446" class="detail">Разметка требований</text>
    <text x="666" y="465" class="detail">Дубли между источниками</text>
  </g>

  <g>
    <rect x="40" y="526" width="272" height="104" rx="12" class="future"/>
    <text x="58" y="561" class="title">Результаты</text>
    <text x="58" y="586" class="detail">Сводки по спросу</text>
    <text x="58" y="605" class="detail">на профессии и навыки</text>
  </g>
  <g>
    <rect x="344" y="526" width="272" height="104" rx="12" class="future"/>
    <text x="362" y="561" class="title">Модуль аналитики</text>
    <text x="362" y="586" class="detail">Расчёт показателей</text>
    <text x="362" y="605" class="detail">по проверенным данным</text>
  </g>
  <g>
    <rect x="648" y="526" width="272" height="104" rx="12" class="future"/>
    <text x="666" y="561" class="title">Проверенные данные</text>
    <text x="666" y="586" class="detail">Нормализованные вакансии</text>
    <text x="666" y="605" class="detail">и связи с навыками</text>
  </g>
</svg>
