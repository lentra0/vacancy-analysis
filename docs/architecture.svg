<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура и роадмап</title>
  <desc id="desc">Chromium открывает страницы HH, сборщик читает карточки и сохраняет их в SQLite. Команда export выгружает данные в JSON. Дальше запланированы ручной импорт, нормализация и аналитика.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#17243b"/>
      <stop offset="1" stop-color="#10182a"/>
    </linearGradient>
    <marker id="chevron" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="m2 1 4 3-4 3" fill="none" stroke="#6fa5a7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", sans-serif; }
      .heading { fill: #f3f7ff; font-size: 30px; font-weight: 700; }
      .current { fill: #8ee8ce; font-weight: 650; font-size: 15px; }
      .planned { fill: #bac9ea; font-weight: 650; font-size: 15px; }
      .title { fill: #f3f7ff; font-size: 18px; font-weight: 650; }
      .detail { fill: #b3c4db; font-size: 13px; }
      .ready { fill: #182f3b; stroke: #457666; }
      .future { fill: #1c2942; stroke: #455c85; }
      .rule { stroke: #334564; }
      .link { stroke: #6fa5a7; stroke-width: 1.5; marker-end: url(#chevron); }
    </style>
  </defs>

  <rect width="960" height="450" rx="24" fill="url(#background)"/>
  <text x="40" y="61" class="heading">Архитектура и роадмап</text>

  <circle cx="45" cy="96" r="4" fill="#8ee8ce"/>
  <text x="58" y="101" class="current">Сейчас</text>
  <path class="rule" d="M148 96h772"/>
  <path class="link" d="M241 178h23"/>
  <path class="link" d="M469 178h23"/>
  <path class="link" d="M697 178h23"/>

  <g>
    <rect x="40" y="122" width="196" height="112" rx="14" class="ready"/>
    <text x="58" y="158" class="title">Chromium</text>
    <text x="58" y="184" class="detail">Открывает выдачу</text>
    <text x="58" y="203" class="detail">и карточки HH</text>
  </g>
  <g>
    <rect x="268" y="122" width="196" height="112" rx="14" class="ready"/>
    <text x="286" y="158" class="title">Сборщик HH</text>
    <text x="286" y="184" class="detail">Читает HTML,</text>
    <text x="286" y="203" class="detail">убирает повторы по ID</text>
  </g>
  <g>
    <rect x="496" y="122" width="196" height="112" rx="14" class="ready"/>
    <text x="514" y="158" class="title">SQLite</text>
    <text x="514" y="184" class="detail">Хранит вакансии</text>
    <text x="514" y="203" class="detail">и историю запусков</text>
  </g>
  <g>
    <rect x="724" y="122" width="196" height="112" rx="14" class="ready"/>
    <text x="742" y="158" class="title">JSON</text>
    <text x="742" y="184" class="detail">Выгрузка карточек</text>
    <text x="742" y="203" class="detail">для обработки</text>
  </g>

  <circle cx="45" cy="273" r="4" fill="#99aee6"/>
  <text x="58" y="278" class="planned">Дальше</text>
  <path class="rule" d="M148 273h772"/>

  <g>
    <rect x="40" y="297" width="272" height="112" rx="14" class="future"/>
    <text x="58" y="333" class="title">Ручной импорт</text>
    <text x="58" y="359" class="detail">Загрузка тестовых карточек</text>
    <text x="58" y="378" class="detail">Проверка обработки данных</text>
  </g>
  <g>
    <rect x="344" y="297" width="272" height="112" rx="14" class="future"/>
    <text x="362" y="333" class="title">Нормализация</text>
    <text x="362" y="359" class="detail">Справочник профессий и навыков</text>
    <text x="362" y="378" class="detail">Проверка правил и дублей</text>
  </g>
  <g>
    <rect x="648" y="297" width="272" height="112" rx="14" class="future"/>
    <text x="666" y="333" class="title">Аналитика</text>
    <text x="666" y="359" class="detail">Сводки по профессиям</text>
    <text x="666" y="378" class="detail">и спросу на навыки</text>
  </g>
</svg>
