name: Сборка и релиз

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            executable: vacancy-analysis-linux-x64
          - platform: windows-x64
            runner: windows-2022
            executable: vacancy-analysis-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
      HH_TEST_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps --no-shell chromium
      - if: runner.os == 'Windows'
        run: python -m playwright install --no-shell chromium
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - name: Проверить бинарник
        run: python scripts/smoke_binary.py "dist/${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Опубликовать релиз
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_SERIES: '0.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Добавить файлы в релиз
        run: |
          version="v${VERSION_SERIES}.${GITHUB_RUN_NUMBER}"
          linux="dist/vacancy-analysis-${version}-linux-x64"
          windows="dist/vacancy-analysis-${version}-windows-x64.exe"
          mv dist/vacancy-analysis-linux-x64 "$linux"
          mv dist/vacancy-analysis-windows-x64.exe "$windows"

          subject=$(git show -s --format=%s "$GITHUB_SHA")
          notes="$RUNNER_TEMP/release-notes.md"
          printf 'Коммит сборки [`%s`](%s/%s/commit/%s)\n\n%s\n' \
            "${GITHUB_SHA:0:12}" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_SHA" "$subject" > "$notes"

          if tagged_sha=$(gh api "repos/$GH_REPO/commits/$version" --jq .sha 2>/dev/null); then
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              printf 'Версия %s уже указывает на коммит %s\n' "$version" "$tagged_sha" >&2
              exit 1
            fi
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" "$linux" "$windows" --clobber
            gh release edit "$version" --title "$version" --notes-file "$notes"
          else
            gh release create "$version" "$linux" "$windows" --target "$GITHUB_SHA" \
              --title "$version" --notes-file "$notes"
          fi
