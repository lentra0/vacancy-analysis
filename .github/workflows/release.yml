name: Сборка и релиз

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            executable: vacancy-analysis-linux-x64
          - platform: windows-x64
            runner: windows-2022
            executable: vacancy-analysis-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
      HH_TEST_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - name: Проверить бинарник
        shell: bash
        run: |
          "./dist/${{ matrix.executable }}" --help
          "./dist/${{ matrix.executable }}" --db smoke.sqlite3 export > smoke.json
          python -c 'import json; assert json.load(open("smoke.json", encoding="utf-8")) == []'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error

  release:
    name: Опубликовать релиз
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Добавить файлы в релиз
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          files=(dist/vacancy-analysis-linux-x64 dist/vacancy-analysis-windows-x64.exe)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
              --title "Сборка ${GITHUB_RUN_NUMBER}" --generate-notes
          fi
